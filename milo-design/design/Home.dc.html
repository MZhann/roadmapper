<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — goals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
a{color:#3346D3}a:hover{color:#2535A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F5; color: #15171A; display: flex; flex-direction: column; font-family: 'Nunito', system-ui, sans-serif">
  <div style="flex: 1; padding: 60px 20px 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.5px">Your goals</h1>
      <div style="display: flex; gap: 8px">
        <div style="display: flex; align-items: center; gap: 5px; padding: 7px 10px; border-radius: 12px; background: #FFF3E6; color: #8A4A0E; font-weight: 900; font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C2620F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1.5 2 2 2.5 2.5C12 8 12 5 12 3z"></path></svg>12</div>
        <div style="display: flex; align-items: center; gap: 5px; padding: 7px 10px; border-radius: 12px; background: #E8EBFC; color: #2535A8; font-weight: 900; font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3346D3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>840</div>
      </div>
    </div>

    <a href="Lesson.dc.html" style="margin-top: 20px; display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 24px; background: #3346D3; color: #FFFFFF; text-decoration: none; box-shadow: 0 5px 0 #2535A8">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 900; letter-spacing: 0.6px; text-transform: uppercase; opacity: 0.85">Today · Step 9 of 24</span>
        <span style="font-size: 13px; font-weight: 800; opacity: 0.85">20 min</span>
      </div>
      <div style="font-size: 22px; font-weight: 900; line-height: 1.2">Ordering at a restaurant</div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 700; opacity: 0.85">Japanese for your trip</span>
        <span style="height: 40px; padding: 0 16px; border-radius: 12px; background: #FFFFFF; color: #2535A8; font-weight: 900; font-size: 15px; display: flex; align-items: center">Start</span>
      </div>
    </a>

    <div style="font-size: 13px; font-weight: 800; color: #5E646B; text-transform: uppercase; letter-spacing: 0.6px; margin: 26px 0 12px">In progress</div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="3">
        <a href="Roadmap.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E6E1; text-decoration: none; color: #15171A">
          <div style="position: relative; flex: none; width: 52px; height: 52px">
            <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" fill="none" stroke="#ECEEEA" stroke-width="5"></circle><circle cx="26" cy="26" r="22" fill="none" stroke="{{g.color}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{g.dash}}" transform="rotate(-90 26 26)"></circle></svg>
            <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900">{{g.pct}}</span>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.title}}</div>
            <div style="font-size: 13px; font-weight: 700; color: #5E646B; margin-top: 2px">{{g.meta}}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A9097" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>

    <a href="HomeEmpty.dc.html" style="margin-top: 12px; height: 52px; border-radius: 16px; border: 2px dashed #C9CDC6; color: #3A4048; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New goal
    </a>
  </div>

  <nav aria-label="Main" style="height: 84px; background: #FFFFFF; border-top: 1px solid #E4E6E1; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
    <a href="Home.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #3346D3; text-decoration: none; min-width: 64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20c0-5 12-4 12-9S8 8 8 4"></path><circle cx="8" cy="4" r="1.5"></circle><circle cx="6" cy="20" r="1.5"></circle></svg>Path</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #5E646B; text-decoration: none; min-width: 64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M9 9h6M9 13h4"></path></svg>Journal</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #5E646B; text-decoration: none; min-width: 64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = 2 * Math.PI * 22;
    const g = (title, meta, p, color) => ({ title, meta, pct: p + '%', color, dash: (C * p / 100).toFixed(1) + ' ' + C.toFixed(1) });
    return {
      goals: [
        g('Japanese for your trip', 'Languages · 8 of 24 steps · 30 days left', 33, '#3346D3'),
        g('Juggle three balls', 'Sport · 14 of 20 steps · on track', 70, '#3346D3'),
        g('Earn $1,000 freelancing', 'Money · 3 of 18 steps · 2 days behind', 17, '#D9822B')
      ]
    };
  }
}
</script>
</body>
</html>
