<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roadmap — dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F1113">
  <dc-import name="Roadmap" theme="{{theme}}" dark="{{ true }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"sports_movement","options":["languages_learning","sports_movement","money_business","art_creativity","technology","life_wellbeing","general_adventure"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'sports_movement' };
  }
}
</script>
</body>
</html>
